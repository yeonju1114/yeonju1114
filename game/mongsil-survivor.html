<style>

#bg-game{position:relative;max-width:960px;margin:0 auto;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#f6e7cf;line-height:1.5;-webkit-user-select:none;user-select:none}

#bg-game .bgg-ov p{margin:0;font-size:14px;color:#cdbfd8;max-width:600px}
#bg-game .bgg-ov .bgg-sub{font-size:12px;color:#9d8fb0}

#bg-game .bgg-pick{flex:1 1 170px;max-width:240px;min-height:150px;padding:10px;text-align:center;border:3px solid #f6e7cf;background:#2a1d2e;color:#f6e7cf;font:inherit;cursor:pointer;box-shadow:4px 4px 0 #0f0b13;display:flex;flex-direction:column;align-items:center;gap:4px}
