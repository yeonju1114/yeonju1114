<div id="bg-game">
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
#bg-game{position:relative;max-width:960px;margin:0 auto;font-family:'Jua','Gamja Flower','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:#5b3a29;line-height:1.5;-webkit-user-select:none;user-select:none}
#bg-game *{box-sizing:border-box}
#bg-game .bgg-wrap{position:relative;border:4px solid #ffc9d6;border-radius:22px;overflow:hidden;background:#fdf3e4}
#bg-game canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;touch-action:none;outline:none;background:#fdf3e4;border:0;border-radius:0;margin:0;max-width:100%}
#bg-game canvas:focus-visible{outline:3px solid #ff8fab;outline-offset:-3px}
#bg-game .bgg-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:rgba(255,244,229,.93);color:#5b3a29}
#bg-game .bgg-ov[hidden]{display:none}
#bg-game .bgg-ov h3{margin:0;padding:0;border:0;font-size:32px;font-weight:400;letter-spacing:0;color:#ff7a9a;text-shadow:0 3px 0 #ffe0e8}
#bg-game .bgg-ov h3::before{content:none}
#bg-game .bgg-ov p{margin:0;font-size:16px;color:#7a5642;max-width:560px}
#bg-game .bgg-face{font-size:54px;line-height:1;animation:bgg-bob 1.1s ease-in-out infinite}
@keyframes bgg-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#bg-game .bgg-btn{min-height:50px;padding:0 28px;border:0;border-radius:999px;background:#ff8fab;color:#fff;font:inherit;font-size:20px;cursor:pointer;box-shadow:0 5px 0 #e0678a;transition:transform .08s}
#bg-game .bgg-btn:hover,#bg-game .bgg-btn:focus-visible{transform:translateY(-2px);outline:none}
#bg-game .bgg-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e0678a}
#bg-game .bgg-picks{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
#bg-game .bgg-pick{flex:1 1 190px;max-width:250px;min-height:112px;padding:12px;text-align:center;border:3px solid #ffd0dc;border-radius:18px;background:#fff;color:#5b3a29;font:inherit;cursor:pointer;box-shadow:0 4px 0 #ffd0dc;transition:transform .1s}
#bg-game .bgg-pick:hover,#bg-game .bgg-pick:focus-visible{transform:translateY(-4px);border-color:#ff8fab;outline:none}
#bg-game .bgg-pick i{display:block;font-style:normal;font-size:30px;line-height:1.2}
#bg-game .bgg-pick b{display:block;color:#ff6b8f;font-size:18px;font-weight:400}
#bg-game .bgg-pick span{display:block;font-size:14px;color:#7a5642}
#bg-game .bgg-help{margin:10px 0 0;font-size:14px;color:#9b7a66;text-align:center}
@media (prefers-reduced-motion:reduce){#bg-game .bgg-face{animation:none}}
</style>
<div class="bgg-wrap">
<canvas width="960" height="600" tabindex="0" aria-label="몽실이 서바이벌 게임 화면"></canvas>
<div class="bgg-ov" data-ov="start"><div class="bgg-face">🐱</div><h3>몽실이 서바이벌</h3><p>몰려오는 말랑이들을 3분 동안 버텨요! 공격은 알아서 나가니까 피하기만 하면 돼요.</p><p>이동: 방향키 / WASD · 모바일: 화면을 쓱 드래그 · 일시정지: P</p><button class="bgg-btn" type="button" data-act="start">시작하기 ▶</button></div>
<div class="bgg-ov" data-ov="level" hidden><h3>레벨 업! ✨</h3><p>하나 골라요</p><div class="bgg-picks"></div></div>
<div class="bgg-ov" data-ov="over" hidden><div class="bgg-face">😵</div><h3>앗, 쓰러졌어요</h3><p data-r="over"></p><button class="bgg-btn" type="button" data-act="start">다시 도전 ▶</button></div>
<div class="bgg-ov" data-ov="win" hidden><div class="bgg-face">🎉</div><h3>3분 버티기 성공!</h3><p data-r="win"></p><button class="bgg-btn" type="button" data-act="start">한 번 더 ▶</button></div>
<div class="bgg-ov" data-ov="pause" hidden><h3>잠깐 쉬는 중 ☕</h3><button class="bgg-btn" type="button" data-act="resume">계속하기 ▶</button></div>
</div>
<p class="bgg-help">⭐ 별 슈터 · 💗 하트 오브 · 🫧 뽀글 폭탄이 자동으로 나가요. 사탕 ✨ 을 모아 레벨업!</p>
<script>
(function () {
  var root = document.getElementById('bg-game');
  if (!root) { return; }
  var cv = root.querySelector('canvas');
  var ctx = cv.getContext('2d');
  var W = 960, H = 600, TAU = 6.2832;
  var FONT = '"Jua","Gamja Flower","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  var INK = '#5b3a29';
  var ovs = {};
  var list = root.querySelectorAll('.bgg-ov');
  for (var i = 0; list.length > i; i++) { ovs[list[i].getAttribute('data-ov')] = list[i]; }
  var picks = root.querySelector('.bgg-picks');

  var DURATION = 180;
  var TYPES = {
    slime: { hp: 12, sp: 82, r: 13, dmg: 8, xp: 1 },
    ghost: { hp: 10, sp: 130, r: 12, dmg: 8, xp: 1 },
    bat: { hp: 8, sp: 155, r: 10, dmg: 7, xp: 2 },
    gummy: { hp: 170, sp: 62, r: 24, dmg: 18, xp: 10 }
  };
  var UPS = [
    { id: 'star', ic: '⭐', name: '별 슈터', w: true, d: function (l) { return l > 0 ? '별이 더 빠르고 더 많이!' : '가까운 친구에게 별을 쏴요'; } },
    { id: 'heart', ic: '💗', name: '하트 오브', w: true, d: function (l) { return l > 0 ? '하트가 하나 더 늘어나요' : '몸 주위를 빙글빙글 돌아요'; } },
    { id: 'bubble', ic: '🫧', name: '뽀글 폭탄', w: true, d: function (l) { return l > 0 ? '더 넓게, 더 자주 터져요' : '주기적으로 뽕! 하고 터져요'; } },
    { id: 'shoes', ic: '👟', name: '운동화', w: false, d: function () { return '이동 속도 +12%'; } },
    { id: 'snack', ic: '🍪', name: '간식 타임', w: false, d: function () { return '최대 체력 +25, 체력 회복'; } },
    { id: 'magnet', ic: '🧲', name: '자석', w: false, d: function () { return '사탕을 더 멀리서 빨아들여요'; } },
    { id: 'power', ic: '💪', name: '파워 쿠키', w: false, d: function () { return '모든 공격 +15%'; } }
  ];

  var S = null, mode = 'menu', last = 0, keys = {}, joy = null, best = 0;
  try { best = parseInt(localStorage.getItem('bgMongsilBest') || '0', 10) || 0; } catch (e) { best = 0; }

  function reset() {
    S = {
      t: 0, px: 0, py: 0, hp: 100, mhp: 100, spd: 195, lvl: 1, xp: 0, need: 5, kills: 0,
      en: [], pr: [], gem: [], fx: [], pt: [], dm: 1, mag: 80, inv: 0, sp: 0, face: 0, mv: 0,
      w: { star: 1, heart: 0, bubble: 0 }, cds: 0, cdb: 2, ang: 0
    };
  }
  function show(name) { for (var k in ovs) { ovs[k].hidden = (k !== name); } }
  function fmt(t) {
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ':' + (10 > s ? '0' : '') + s;
  }
  function start() { reset(); mode = 'play'; show(''); last = performance.now(); cv.focus(); }
  function end(win) {
    mode = win ? 'win' : 'over';
    var txt = '버틴 시간 ' + fmt(S.t) + ' · 레벨 ' + S.lvl + ' · 쓰러뜨린 친구 ' + S.kills + '마리';
    if (S.t > best) { best = Math.floor(S.t); try { localStorage.setItem('bgMongsilBest', String(best)); } catch (e) {} txt += ' · 🏆 최고 기록!'; }
    else { txt += ' · 최고 ' + fmt(best); }
    root.querySelector('[data-r="' + (win ? 'win' : 'over') + '"]').textContent = txt;
    show(win ? 'win' : 'over');
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function spawn() {
    var t = S.t, type = 'slime', r = Math.random();
    if (t > 15) { if (r > 0.65) { type = 'ghost'; } }
    if (t > 40) { if (r > 0.82) { type = 'bat'; } }
    if (t > 80) { if (r > 0.965) { type = 'gummy'; } }
    var d = TYPES[type], a = rnd(0, TAU), dist = 540;
    var sc = 1 + t / 90;
    S.en.push({ x: S.px + Math.cos(a) * dist, y: S.py + Math.sin(a) * dist, hp: d.hp * sc, d: d, k: type, fl: 0, ht: 0, ph: rnd(0, TAU) });
  }
  function levelUp() {
    S.xp -= S.need; S.lvl++; S.need = 3 + S.lvl * 2;
    var pool = [], i;
    for (i = 0; UPS.length > i; i++) {
      var u = UPS[i];
      if (u.w) { if (5 > S.w[u.id]) { pool.push(u); } } else { pool.push(u); }
    }
    for (var j = pool.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var tmp = pool[j]; pool[j] = pool[k]; pool[k] = tmp; }
    var ch = pool.slice(0, 3);
    picks.textContent = '';
    for (var n = 0; ch.length > n; n++) {
      (function (u) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'bgg-pick';
        var ic = document.createElement('i'); ic.textContent = u.ic;
        var h = document.createElement('b'); h.textContent = u.name + (u.w ? ' Lv ' + (S.w[u.id] + 1) : '');
        var s = document.createElement('span'); s.textContent = u.d(u.w ? S.w[u.id] : 0);
        b.appendChild(ic); b.appendChild(h); b.appendChild(s);
        b.addEventListener('click', function () { pick(u.id); });
        picks.appendChild(b);
      })(ch[n]);
    }
    mode = 'level'; show('level');
    var first = picks.querySelector('button'); if (first) { first.focus(); }
  }
  function pick(id) {
    if (id === 'star' || id === 'heart' || id === 'bubble') { S.w[id]++; }
    else if (id === 'shoes') { S.spd *= 1.12; }
    else if (id === 'snack') { S.mhp += 25; S.hp = Math.min(S.mhp, S.hp + 40); }
    else if (id === 'magnet') { S.mag *= 1.45; }
    else if (id === 'power') { S.dm *= 1.15; }
    if (S.xp >= S.need) { levelUp(); return; }
    mode = 'play'; show(''); last = performance.now(); cv.focus();
  }

  function burst(x, y, col, n) {
    for (var i = 0; n > i; i++) {
      var a = rnd(0, TAU), s = rnd(60, 190);
      S.pt.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.3, 0.55), t: 0.5, c: col, r: rnd(2.5, 5) });
    }
  }
  var KCOL = { slime: '#8fe3b0', ghost: '#e8e2ff', bat: '#b69cf0', gummy: '#ffb37a' };
  function hit(e, dmg) {
    e.hp -= dmg * S.dm; e.fl = 0.08;
    if (e.hp > 0) { return; }
    e.dead = true; S.kills++;
    S.gem.push({ x: e.x, y: e.y, v: e.d.xp, ph: rnd(0, TAU) });
    burst(e.x, e.y, KCOL[e.k], e.k === 'gummy' ? 14 : 6);
  }

  function update(dt) {
    S.t += dt;
    if (S.t >= DURATION) { end(true); return; }
    var dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.a) { dx -= 1; }
    if (keys.ArrowRight || keys.d) { dx += 1; }
    if (keys.ArrowUp || keys.w) { dy -= 1; }
    if (keys.ArrowDown || keys.s) { dy += 1; }
    if (joy) { dx += joy.x; dy += joy.y; }
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m > 1) { dx /= m; dy /= m; }
    S.mv = m > 0.05 ? 1 : 0;
    if (S.mv) { S.face = Math.atan2(dy, dx); }
    S.px += dx * S.spd * dt; S.py += dy * S.spd * dt;
    if (S.inv > 0) { S.inv -= dt; }
    var iv = Math.max(0.075, 0.5 - S.t * 0.0024);
    S.sp -= dt;
    while (0 >= S.sp) {
      if (S.en.length > 300) { S.sp = iv; break; }
      spawn(); S.sp += iv;
      if (S.t > 60) { spawn(); }
      if (S.t > 120) { spawn(); }
    }
    var i, j, e, p, g;
    for (i = 0; S.en.length > i; i++) {
      e = S.en[i];
      var ex = S.px - e.x, ey = S.py - e.y, ed = Math.sqrt(ex * ex + ey * ey) || 1;
      var vx = ex / ed, vy = ey / ed;
      if (e.k === 'bat') { var z = Math.sin(S.t * 6 + e.ph) * 0.9; var nvx = vx - vy * z, nvy = vy + vx * z; vx = nvx; vy = nvy; }
      e.x += vx * e.d.sp * dt; e.y += vy * e.d.sp * dt;
      if (e.fl > 0) { e.fl -= dt; }
      if (e.ht > 0) { e.ht -= dt; }
      if (e.d.r + 11 > ed) {
        if (0 >= S.inv) {
          S.hp -= e.d.dmg; S.inv = 0.5;
          burst(S.px, S.py, '#ff8fab', 5);
          if (0 >= S.hp) { S.hp = 0; end(false); return; }
        }
      }
    }
    // star shooter
    S.cds -= dt;
    if (0 >= S.cds) {
      var sl = S.w.star, tgt = null, bd = 1e9;
      for (i = 0; S.en.length > i; i++) {
        e = S.en[i]; var q = (e.x - S.px) * (e.x - S.px) + (e.y - S.py) * (e.y - S.py);
        if (bd > q) { bd = q; tgt = e; }
      }
      if (tgt) {
        var cnt = 1 + (sl > 2 ? 1 : 0) + (sl > 4 ? 1 : 0);
        var base = Math.atan2(tgt.y - S.py, tgt.x - S.px);
        for (j = 0; cnt > j; j++) {
          var an = base + (j - (cnt - 1) / 2) * 0.2;
          S.pr.push({ x: S.px, y: S.py, vx: Math.cos(an) * 470, vy: Math.sin(an) * 470, life: 1.1, pi: 1 + Math.floor(sl / 2), dmg: 8 + 3 * sl, rot: 0 });
        }
        S.cds = Math.max(0.25, 0.7 - 0.08 * sl);
      } else { S.cds = 0.15; }
    }
    for (i = 0; S.pr.length > i; i++) {
      p = S.pr[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.rot += dt * 9;
      for (j = 0; S.en.length > j; j++) {
        e = S.en[j];
        if (e.dead) { continue; }
        var ddx = e.x - p.x, ddy = e.y - p.y, rr = e.d.r + 6;
        if (rr * rr > ddx * ddx + ddy * ddy) { hit(e, p.dmg); p.pi--; if (0 >= p.pi) { p.life = 0; break; } }
      }
    }
    // heart orbs
    var hl = S.w.heart;
    if (hl > 0) {
      S.ang += dt * 3.2;
      var orbs = hl + 1, orad = 58 + hl * 5;
      for (j = 0; orbs > j; j++) {
        var oa = S.ang + j * TAU / orbs, ox = S.px + Math.cos(oa) * orad, oy = S.py + Math.sin(oa) * orad;
        for (i = 0; S.en.length > i; i++) {
          e = S.en[i];
          if (e.dead || e.ht > 0) { continue; }
          var qx = e.x - ox, qy = e.y - oy, qr = e.d.r + 9;
          if (qr * qr > qx * qx + qy * qy) { hit(e, 7 + 2 * hl); e.ht = 0.35; }
        }
      }
    }
    // bubble pop
    var bl = S.w.bubble;
    if (bl > 0) {
      S.cdb -= dt;
      if (0 >= S.cdb) {
        var rad = 100 + 16 * bl;
        for (i = 0; S.en.length > i; i++) {
          e = S.en[i]; var kx = e.x - S.px, ky = e.y - S.py;
          if (rad * rad > kx * kx + ky * ky) { if (!e.dead) { hit(e, 20 + 9 * bl); } }
        }
        S.fx.push({ x: S.px, y: S.py, max: rad, life: 0.4, t: 0.4 });
        S.cdb = Math.max(1.4, 3.8 - 0.4 * bl);
      }
    }
    // candy gems
    for (i = 0; S.gem.length > i; i++) {
      g = S.gem[i];
      var gx = S.px - g.x, gy = S.py - g.y, gd = Math.sqrt(gx * gx + gy * gy) || 1;
      if (S.mag > gd) { g.x += gx / gd * 380 * dt; g.y += gy / gd * 380 * dt; }
      if (16 > gd) { g.take = true; S.xp += g.v; }
    }
    // particles
    for (i = 0; S.pt.length > i; i++) { var pt = S.pt[i]; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= 0.94; pt.vy *= 0.94; pt.life -= dt; }
    var ne = [];
    for (i = 0; S.en.length > i; i++) {
      e = S.en[i];
      var cx = e.x - S.px, cy = e.y - S.py;
      if (!e.dead) { if (1400 * 1400 > cx * cx + cy * cy) { ne.push(e); } }
    }
    S.en = ne;
    var np = [];
    for (i = 0; S.pr.length > i; i++) { if (S.pr[i].life > 0) { np.push(S.pr[i]); } }
    S.pr = np;
    var ng = [];
    for (i = 0; S.gem.length > i; i++) { if (!S.gem[i].take) { ng.push(S.gem[i]); } }
    S.gem = ng;
    var nf = [];
    for (i = 0; S.fx.length > i; i++) { S.fx[i].life -= dt; if (S.fx[i].life > 0) { nf.push(S.fx[i]); } }
    S.fx = nf;
    var npt = [];
    for (i = 0; S.pt.length > i; i++) { if (S.pt[i].life > 0) { npt.push(S.pt[i]); } }
    S.pt = npt;
    if (S.xp >= S.need) { levelUp(); }
  }

  // ---------- drawing helpers ----------
  function outline() { ctx.lineWidth = 2.5; ctx.strokeStyle = INK; ctx.stroke(); }
  function eyes(x, y, s, dx, dy, blink) {
    ctx.fillStyle = INK;
    var ox = dx * s * 0.1, oy = dy * s * 0.1, ex = s * 0.34, er = s * 0.16;
    if (blink) {
      ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.beginPath();
      ctx.moveTo(x - ex - er, y); ctx.lineTo(x - ex + er, y); ctx.moveTo(x + ex - er, y); ctx.lineTo(x + ex + er, y); ctx.stroke();
      return;
    }
    ctx.beginPath(); ctx.arc(x - ex + ox, y + oy, er, 0, TAU); ctx.arc(x + ex + ox, y + oy, er, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.arc(x - ex + ox - er * 0.3, y + oy - er * 0.35, er * 0.38, 0, TAU); ctx.arc(x + ex + ox - er * 0.3, y + oy - er * 0.35, er * 0.38, 0, TAU); ctx.fill();
  }
  function blush(x, y, s) {
    ctx.fillStyle = 'rgba(255,120,150,.5)'; ctx.beginPath();
    ctx.ellipse(x - s * 0.62, y + s * 0.22, s * 0.17, s * 0.1, 0, 0, TAU); ctx.ellipse(x + s * 0.62, y + s * 0.22, s * 0.17, s * 0.1, 0, 0, TAU); ctx.fill();
  }
  function smile(x, y, s) {
    ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.beginPath(); ctx.arc(x, y + s * 0.18, s * 0.16, 0.15, Math.PI - 0.15); ctx.stroke();
  }
  function drawCat(x, y, t) {
    var r = 15, sq = 1 + (S.mv ? Math.sin(t * 16) * 0.07 : Math.sin(t * 3) * 0.03);
    ctx.save(); ctx.translate(x, y); ctx.scale(1 / sq, sq);
    // ears
    ctx.fillStyle = '#ffb27a';
    ctx.beginPath(); ctx.moveTo(-r * 0.95, -r * 0.2); ctx.lineTo(-r * 0.7, -r * 1.35); ctx.lineTo(-r * 0.1, -r * 0.85); ctx.closePath(); ctx.fill(); outline();
    ctx.beginPath(); ctx.moveTo(r * 0.95, -r * 0.2); ctx.lineTo(r * 0.7, -r * 1.35); ctx.lineTo(r * 0.1, -r * 0.85); ctx.closePath(); ctx.fill(); outline();
    // body
    ctx.fillStyle = '#ffd9b0'; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); outline();
    ctx.fillStyle = '#ffb27a'; ctx.beginPath(); ctx.arc(0, -r * 0.8, r * 0.28, 0, TAU); ctx.fill();
    var blink = (Math.floor(t * 2.2) % 9 === 0) ? (t * 2.2 % 1 > 0.5) : false;
    eyes(0, -1, r, Math.cos(S.face), Math.sin(S.face), blink);
    blush(0, -1, r); smile(0, 3, r);
    ctx.restore();
  }
  function drawSlime(e, x, y, t) {
    var r = e.d.r, sq = 1 + Math.sin(t * 8 + e.ph) * 0.09;
    ctx.save(); ctx.translate(x, y + r * 0.1); ctx.scale(1 / sq, sq);
    ctx.fillStyle = e.fl > 0 ? '#fff' : '#8fe3b0';
    ctx.beginPath(); ctx.moveTo(-r, r * 0.6); ctx.quadraticCurveTo(-r * 1.05, -r * 1.1, 0, -r * 1.05); ctx.quadraticCurveTo(r * 1.05, -r * 1.1, r, r * 0.6); ctx.quadraticCurveTo(0, r * 0.95, -r, r * 0.6); ctx.closePath(); ctx.fill(); outline();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.55, r * 0.2, r * 0.12, -0.5, 0, TAU); ctx.fill();
    eyes(0, -r * 0.1, r, 0, 0, false); smile(0, -r * 0.05, r * 0.8);
    ctx.restore();
  }
  function drawGhost(e, x, y, t) {
    var r = e.d.r, wob = Math.sin(t * 5 + e.ph) * 2;
    ctx.save(); ctx.translate(x, y + wob);
    ctx.fillStyle = e.fl > 0 ? '#fff' : '#ece7ff';
    ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, 0); ctx.lineTo(r, r * 0.9);
    ctx.quadraticCurveTo(r * 0.55, r * 0.5, r * 0.33, r * 0.9); ctx.quadraticCurveTo(0, r * 0.5, -r * 0.33, r * 0.9); ctx.quadraticCurveTo(-r * 0.55, r * 0.5, -r, r * 0.9);
    ctx.closePath(); ctx.fill(); outline();
    eyes(0, -r * 0.1, r, 0, 0, false);
    ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, r * 0.3, r * 0.12, r * 0.16, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function drawBat(e, x, y, t) {
    var r = e.d.r, fl = Math.sin(t * 22 + e.ph) * 0.6;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = e.fl > 0 ? '#fff' : '#a98be8';
    ctx.beginPath(); ctx.moveTo(-r * 0.4, 0); ctx.lineTo(-r * 1.8, -r * (0.7 + fl)); ctx.lineTo(-r * 1.4, r * 0.5); ctx.closePath(); ctx.fill(); outline();
    ctx.beginPath(); ctx.moveTo(r * 0.4, 0); ctx.lineTo(r * 1.8, -r * (0.7 + fl)); ctx.lineTo(r * 1.4, r * 0.5); ctx.closePath(); ctx.fill(); outline();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); outline();
    eyes(0, -r * 0.05, r, 0, 0, false);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(-r * 0.3, r * 0.35); ctx.lineTo(-r * 0.15, r * 0.65); ctx.lineTo(0, r * 0.35); ctx.fill();
    ctx.restore();
  }
  function drawGummy(e, x, y, t) {
    var r = e.d.r, sq = 1 + Math.sin(t * 5 + e.ph) * 0.05;
    ctx.save(); ctx.translate(x, y); ctx.scale(1 / sq, sq);
    ctx.fillStyle = e.fl > 0 ? '#fff' : '#ffb37a';
    ctx.beginPath(); ctx.arc(-r * 0.7, -r * 0.8, r * 0.35, 0, TAU); ctx.fill(); outline();
    ctx.beginPath(); ctx.arc(r * 0.7, -r * 0.8, r * 0.35, 0, TAU); ctx.fill(); outline();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); outline();
    ctx.fillStyle = e.fl > 0 ? '#fff' : '#ffd2a8'; ctx.beginPath(); ctx.ellipse(0, r * 0.35, r * 0.55, r * 0.45, 0, 0, TAU); ctx.fill();
    eyes(0, -r * 0.2, r, 0, 0, false);
    ctx.fillStyle = INK; ctx.beginPath(); ctx.ellipse(0, r * 0.1, r * 0.13, r * 0.1, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  function star(x, y, r, rot) {
    ctx.beginPath();
    for (var i = 0; 10 > i; i++) {
      var a = rot + i * Math.PI / 5 - Math.PI / 2, rr = (i % 2 === 0) ? r : r * 0.45;
      if (i === 0) { ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } else { ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    }
    ctx.closePath();
  }
  function heart(x, y, s) {
    ctx.beginPath(); ctx.moveTo(x, y + s * 0.8);
    ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.8);
    ctx.closePath();
  }
  function pill(x, y, w, h) {
    var r = h / 2; ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arc(x + w - r, y + r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(x + r, y + h); ctx.arc(x + r, y + r, r, Math.PI / 2, Math.PI * 1.5); ctx.closePath();
  }

  function draw() {
    var cx = S.px - W / 2, cy = S.py - H / 2, i, e, t = S.t;
    ctx.fillStyle = '#fdf3e4'; ctx.fillRect(0, 0, W, H);
    // polka dots
    ctx.fillStyle = '#f6dfc4';
    var gs = 64, gx0 = -(((cx % gs) + gs) % gs), gy0 = -(((cy % gs) + gs) % gs);
    var row = 0;
    for (var y = gy0; H + gs > y; y += gs) {
      var off = (Math.floor((y + cy) / gs) % 2 === 0) ? 0 : gs / 2;
      for (var x = gx0 - gs; W + gs > x; x += gs) { ctx.beginPath(); ctx.arc(x + off, y, 4, 0, TAU); ctx.fill(); }
      row++;
    }
    // candy gems
    for (i = 0; S.gem.length > i; i++) {
      var g = S.gem[i], bob = Math.sin(t * 5 + g.ph) * 2;
      ctx.fillStyle = g.v > 4 ? '#ff8fab' : '#ffd84d'; star(g.x - cx, g.y - cy + bob, 7, t * 2 + g.ph); ctx.fill();
    }
    // bubble pop fx
    for (i = 0; S.fx.length > i; i++) {
      var f = S.fx[i], k = 1 - f.life / f.t;
      ctx.globalAlpha = (1 - k) * 0.55; ctx.fillStyle = '#bfe9ff'; ctx.beginPath(); ctx.arc(f.x - cx, f.y - cy, f.max * k, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#7cc8f0'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x - cx, f.y - cy, f.max * k, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
    }
    // enemies (back to front)
    var sorted = S.en.slice().sort(function (a, b) { return a.y - b.y; });
    for (i = 0; sorted.length > i; i++) {
      e = sorted[i];
      var sx = e.x - cx, sy = e.y - cy;
      if (-50 > sx || sx > W + 50 || -50 > sy || sy > H + 50) { continue; }
      ctx.fillStyle = 'rgba(91,58,41,.12)'; ctx.beginPath(); ctx.ellipse(sx, sy + e.d.r * 0.9, e.d.r * 0.9, e.d.r * 0.3, 0, 0, TAU); ctx.fill();
      if (e.k === 'slime') { drawSlime(e, sx, sy, t); }
      else if (e.k === 'ghost') { drawGhost(e, sx, sy, t); }
      else if (e.k === 'bat') { drawBat(e, sx, sy, t); }
      else { drawGummy(e, sx, sy, t); }
    }
    // stars
    for (i = 0; S.pr.length > i; i++) {
      var p = S.pr[i];
      ctx.fillStyle = '#ffd84d'; star(p.x - cx, p.y - cy, 9, p.rot); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
    }
    // hearts
    if (S.w.heart > 0) {
      var orbs = S.w.heart + 1, rr = 58 + S.w.heart * 5;
      for (var j = 0; orbs > j; j++) {
        var oa = S.ang + j * TAU / orbs;
        ctx.fillStyle = '#ff8fab'; heart(S.px - cx + Math.cos(oa) * rr, S.py - cy + Math.sin(oa) * rr, 9); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.stroke();
      }
    }
    // player
    var pxs = W / 2, pys = H / 2;
    ctx.fillStyle = 'rgba(91,58,41,.15)'; ctx.beginPath(); ctx.ellipse(pxs, pys + 15, 14, 5, 0, 0, TAU); ctx.fill();
    var blinkA = 1;
    if (S.inv > 0) { if (Math.floor(t * 20) % 2 === 0) { blinkA = 0.5; } }
    ctx.globalAlpha = blinkA; drawCat(pxs, pys, t); ctx.globalAlpha = 1;
    // particles
    for (i = 0; S.pt.length > i; i++) {
      var pt = S.pt[i]; ctx.globalAlpha = Math.max(0, pt.life / pt.t); ctx.fillStyle = pt.c;
      ctx.beginPath(); ctx.arc(pt.x - cx, pt.y - cy, pt.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // joystick
    if (joy) {
      ctx.strokeStyle = 'rgba(255,143,171,.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 44, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,143,171,.8)'; ctx.beginPath(); ctx.arc(joy.ox + joy.x * 44, joy.oy + joy.y * 44, 16, 0, TAU); ctx.fill();
    }
    // HUD
    ctx.fillStyle = 'rgba(255,255,255,.85)'; pill(12, 10, 210, 28); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffd0dc'; ctx.stroke();
    ctx.fillStyle = '#ff6b8f'; heart(30, 25, 7); ctx.fill();
    ctx.fillStyle = '#ffe3ea'; pill(46, 18, 164, 12); ctx.fill();
    ctx.fillStyle = '#ff8fab'; var hw = Math.max(0, 164 * (S.hp / S.mhp)); if (hw > 12) { pill(46, 18, hw, 12); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.85)'; pill(W / 2 - 50, 10, 100, 28); ctx.fill(); ctx.strokeStyle = '#ffd0dc'; ctx.stroke();
    ctx.fillStyle = INK; ctx.font = '18px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(fmt(DURATION - t), W / 2, 25);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; pill(W - 222, 10, 210, 28); ctx.fill(); ctx.strokeStyle = '#ffd0dc'; ctx.stroke();
    ctx.fillStyle = INK; ctx.font = '16px ' + FONT; ctx.fillText('Lv ' + S.lvl + '   ✨ ' + S.kills, W - 117, 25);
    // xp bar
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(0, H - 10, W, 10);
    ctx.fillStyle = '#ffd84d'; ctx.fillRect(0, H - 10, W * Math.min(1, S.xp / S.need), 10);
  }

  function frame(now) {
    if (S) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (mode === 'play') {
        if (!document.hidden) { update(dt); } else { pauseGame(); }
      }
      if (S) { draw(); }
    }
    requestAnimationFrame(frame);
  }
  function pauseGame() { if (mode === 'play') { mode = 'pause'; show('pause'); } }
  function resumeGame() { if (mode === 'pause') { mode = 'play'; show(''); last = performance.now(); cv.focus(); } }

  root.addEventListener('click', function (ev) {
    var a = ev.target.getAttribute ? ev.target.getAttribute('data-act') : null;
    if (a === 'start') { start(); }
    else if (a === 'resume') { resumeGame(); }
  });
  window.addEventListener('keydown', function (ev) {
    var k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (k === 'p' || k === 'Escape') { if (mode === 'play') { pauseGame(); } else if (mode === 'pause') { resumeGame(); } return; }
    if (document.activeElement === cv) {
      if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ') { ev.preventDefault(); }
    }
    keys[k] = true;
  });
  window.addEventListener('keyup', function (ev) {
    var k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    keys[k] = false;
  });
  window.addEventListener('blur', function () { keys = {}; pauseGame(); });
  function pos(ev) {
    var r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };
  }
  cv.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'mouse') { return; }
    var p = pos(ev); joy = { id: ev.pointerId, ox: p.x, oy: p.y, x: 0, y: 0 };
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  cv.addEventListener('pointermove', function (ev) {
    if (!joy) { return; }
    if (joy.id !== ev.pointerId) { return; }
    var p = pos(ev), dx = p.x - joy.ox, dy = p.y - joy.oy, d = Math.sqrt(dx * dx + dy * dy) || 1, c = Math.min(1, d / 44);
    joy.x = dx / d * c; joy.y = dy / d * c;
  });
  function endJoy(ev) { if (joy) { if (joy.id === ev.pointerId) { joy = null; } } }
  cv.addEventListener('pointerup', endJoy);
  cv.addEventListener('pointercancel', endJoy);

  reset(); draw();
  requestAnimationFrame(frame);
})();
</script>
