<div id="bg-game">
<style>

<div class="bgg-ov" data-ov="start"><div class="bgg-cat"></div><h3>MONGSIL<br>SURVIVOR</h3><p>비 오는 밤, 길고양이 몽실이의 이야기. 야외 → 병원 → 집, 세 곳의 보스를 쓰러뜨리면 집고양이가 돼요. 공격은 자동으로 나가요.</p><p class="bgg-sub">이동: 방향키 / WASD · 모바일: 화면 드래그 · 카드 선택: 1 2 3 · 일시정지: P</p><button class="bgg-btn" type="button" data-act="start">START</button></div>

<div class="bgg-ov" data-ov="over" hidden><h3>GAME OVER</h3><p data-r="over"></p><button class="bgg-btn" type="button" data-act="start">RETRY</button></div>

<div class="bgg-ov bgg-story" data-ov="story" hidden><canvas class="bgg-scene" width="160" height="64"></canvas><div class="bgg-sbox"><canvas class="bgg-port" width="14" height="13"></canvas><div><div class="bgg-stag" data-r="stag"></div><p class="bgg-stx" data-r="stext"></p></div></div><div class="bgg-sbtn"><button class="bgg-btn" type="button" data-act="snext">NEXT</button><button class="bgg-btn bgg-ghost" type="button" data-act="sskip">SKIP</button></div></div>
<div class="bgg-ov" data-ov="pause" hidden><h3>PAUSE</h3><div class="bgg-list" data-r="items"></div><button class="bgg-btn" type="button" data-act="resume">RESUME</button></div>
