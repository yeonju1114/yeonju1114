<div id="bg-game">
<style>
#bg-game{--gb:var(--bg,#141210);--gs:var(--surface,#1c1a17);--gl:var(--line2,#3a352e);--gt:var(--text,#ece6da);--gd:var(--dim,#958d80);--ga:var(--amber,#f5a524);--gr:var(--red,#e65d55);--gg:var(--green,#7bc67e);position:relative;max-width:960px;margin:0 auto;font-family:var(--mono,'JetBrains Mono',ui-monospace,Consolas,monospace);color:var(--gt);line-height:1.5}
#bg-game *{box-sizing:border-box}
#bg-game .bgg-wrap{position:relative;border:1px solid var(--gl);border-radius:6px;overflow:hidden;background:var(--gb)}
#bg-game canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;touch-action:none;outline:none;background:var(--gb)}
#bg-game canvas:focus-visible{outline:2px solid var(--ga);outline-offset:-2px}
#bg-game .bgg-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:rgba(15,14,12,.86);color:#ece6da}
#bg-game .bgg-ov[hidden]{display:none}
#bg-game .bgg-ov h3{margin:0;font-size:22px;font-weight:600;letter-spacing:0;color:#f5a524;border:0;padding:0}
#bg-game .bgg-ov h3::before{content:none}
#bg-game .bgg-ov p{margin:0;font-size:13px;color:#bdb5a8;max-width:560px}
#bg-game .bgg-btn{min-height:44px;padding:0 18px;border:1px solid #f5a524;border-radius:4px;background:transparent;color:#f5a524;font:inherit;font-size:14px;cursor:pointer}
#bg-game .bgg-btn:hover,#bg-game .bgg-btn:focus-visible{background:#f5a524;color:#1a1408;outline:none}
#bg-game .bgg-picks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
#bg-game .bgg-pick{flex:1 1 200px;max-width:260px;min-height:92px;padding:12px;text-align:left;border:1px solid #3a352e;border-radius:6px;background:#1c1a17;color:#ece6da;font:inherit;cursor:pointer}
#bg-game .bgg-pick:hover,#bg-game .bgg-pick:focus-visible{border-color:#f5a524;outline:none}
#bg-game .bgg-pick b{display:block;color:#f5a524;font-size:14px;font-weight:600;margin-bottom:4px}
#bg-game .bgg-pick span{display:block;font-size:12px;color:#bdb5a8}
#bg-game .bgg-help{margin:8px 0 0;font-size:12px;color:var(--gd)}
</style>
<div class="bgg-wrap">
<canvas width="960" height="600" tabindex="0" aria-label="Uptime Survivor 게임 화면"></canvas>
<div class="bgg-ov" data-ov="start"><h3>$ ./uptime-survivor</h3><p>장애(ERR, TIMEOUT, 502, OOM)가 몰려옵니다. 명령어가 자동으로 발사됩니다. 5분 동안 서비스를 살려 두세요.</p><p>이동: 방향키 / WASD · 모바일: 화면을 드래그 · 일시정지: P</p><button class="bgg-btn" type="button" data-act="start">$ run</button></div>
<div class="bgg-ov" data-ov="level" hidden><h3>LEVEL UP</h3><p>하나를 선택하세요</p><div class="bgg-picks"></div></div>
<div class="bgg-ov" data-ov="over" hidden><h3>SERVICE DOWN</h3><p data-r="over"></p><button class="bgg-btn" type="button" data-act="start">$ retry</button></div>
<div class="bgg-ov" data-ov="win" hidden><h3>UPTIME 5:00 — 배포 성공</h3><p data-r="win"></p><button class="bgg-btn" type="button" data-act="start">$ run again</button></div>
<div class="bgg-ov" data-ov="pause" hidden><h3>PAUSED</h3><button class="bgg-btn" type="button" data-act="resume">$ resume</button></div>
</div>
<p class="bgg-help">자동 공격: grep(탄환) · tail -f(회전) · kill -9(충격파). 레벨업마다 강화 또는 보조 능력을 고릅니다.</p>
<script>
(function () {
  var root = document.getElementById('bg-game');
  if (!root) { return; }
  var cv = root.querySelector('canvas');
  var ctx = cv.getContext('2d');
  var W = 960, H = 600;
  var ovs = {};
  var list = root.querySelectorAll('.bgg-ov');
  for (var i = 0; list.length > i; i++) { ovs[list[i].getAttribute('data-ov')] = list[i]; }
  var picks = root.querySelector('.bgg-picks');
  var C = {};
  function cssv(n, f) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v ? v : f;
  }
  function readColors() {
    C.bg = cssv('--bg', '#141210'); C.grid = cssv('--line', '#2e2a24'); C.line = cssv('--line2', '#3a352e');
    C.text = cssv('--text', '#ece6da'); C.dim = cssv('--dim', '#958d80'); C.amber = cssv('--amber', '#f5a524');
    C.red = cssv('--red', '#e65d55'); C.green = cssv('--green', '#7bc67e'); C.surface = cssv('--surface', '#1c1a17');
  }
  readColors();

  var DURATION = 300;
  var TYPES = {
    ERR: { hp: 10, sp: 55, r: 9, dmg: 6, xp: 1, ch: 'E' },
    TMO: { hp: 8, sp: 98, r: 8, dmg: 5, xp: 1, ch: 'T' },
    G502: { hp: 34, sp: 62, r: 12, dmg: 10, xp: 3, ch: '5' },
    OOM: { hp: 140, sp: 40, r: 20, dmg: 18, xp: 12, ch: 'M' }
  };
  var UPS = [
    { id: 'grep', name: 'grep', w: true, d: function (l) { return l > 0 ? 'Lv ' + l + ' → ' + (l + 1) + ': 탄환 강화(발사 간격, 개수, 관통)' : '가장 가까운 적에게 탄환 발사'; } },
    { id: 'tail', name: 'tail -f', w: true, d: function (l) { return l > 0 ? 'Lv ' + l + ' → ' + (l + 1) + ': 회전 구체 추가' : '몸 주위를 도는 구체가 접촉한 적을 공격'; } },
    { id: 'kill', name: 'kill -9', w: true, d: function (l) { return l > 0 ? 'Lv ' + l + ' → ' + (l + 1) + ': 충격파 범위와 피해 증가' : '주기적으로 주변 적에게 충격파'; } },
    { id: 'nice', name: 'nice -n -5', w: false, d: function () { return '이동 속도 +12%'; } },
    { id: 'ram', name: 'RAM 증설', w: false, d: function () { return '최대 체력 +25, 체력 25 회복'; } },
    { id: 'cache', name: 'cache', w: false, d: function () { return '경험치 흡수 범위 +40%'; } },
    { id: 'cpu', name: 'CPU 증설', w: false, d: function () { return '모든 피해 +15%'; } }
  ];

  var S = null, mode = 'menu', last = 0, keys = {}, joy = null, best = 0;
  try { best = parseInt(localStorage.getItem('bgUptimeBest') || '0', 10) || 0; } catch (e) { best = 0; }

  function reset() {
    S = {
      t: 0, px: 0, py: 0, hp: 100, mhp: 100, spd: 150, lvl: 1, xp: 0, need: 5, kills: 0,
      en: [], pr: [], gem: [], fx: [], dm: 1, mag: 70, inv: 0, sp: 0, face: 0,
      w: { grep: 1, tail: 0, kill: 0 }, cdg: 0, cdk: 2, ang: 0
    };
  }
  function show(name) {
    for (var k in ovs) { ovs[k].hidden = (k !== name); }
  }
  function fmt(t) {
    var m = Math.floor(t / 60), s = Math.floor(t % 60);
    return (10 > m ? '0' : '') + m + ':' + (10 > s ? '0' : '') + s;
  }
  function start() {
    reset(); mode = 'play'; show(''); last = performance.now(); cv.focus();
  }
  function end(win) {
    mode = win ? 'win' : 'over';
    var txt = 'uptime ' + fmt(S.t) + ' · lv ' + S.lvl + ' · kills ' + S.kills;
    if (S.t > best) { best = Math.floor(S.t); try { localStorage.setItem('bgUptimeBest', String(best)); } catch (e) {} txt += ' · NEW BEST'; }
    else { txt += ' · best ' + fmt(best); }
    root.querySelector('[data-r="' + (win ? 'win' : 'over') + '"]').textContent = txt;
    show(win ? 'win' : 'over');
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function spawn() {
    var t = S.t, type = 'ERR', r = Math.random();
    if (t > 40) { if (r > 0.6) { type = 'TMO'; } }
    if (t > 110) { if (r > 0.82) { type = 'G502'; } }
    if (t > 170) { if (r > 0.95) { type = 'OOM'; } }
    var d = TYPES[type];
    var a = rnd(0, 6.2832), dist = 560;
    var sc = 1 + t / 140;
    S.en.push({ x: S.px + Math.cos(a) * dist, y: S.py + Math.sin(a) * dist, hp: d.hp * sc, d: d, fl: 0, ht: 0 });
  }
  function levelUp() {
    S.xp -= S.need; S.lvl++; S.need = 5 + S.lvl * 4;
    var pool = [];
    for (var i = 0; UPS.length > i; i++) {
      var u = UPS[i];
      if (u.w) { if (5 > S.w[u.id]) { pool.push(u); } } else { pool.push(u); }
    }
    for (var j = pool.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var tmp = pool[j]; pool[j] = pool[k]; pool[k] = tmp; }
    var ch = pool.slice(0, 3);
    picks.textContent = '';
    for (var n = 0; ch.length > n; n++) {
      (function (u) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'bgg-pick';
        var h = document.createElement('b'); h.textContent = u.name;
        var s = document.createElement('span'); s.textContent = u.d(u.w ? S.w[u.id] : 0);
        b.appendChild(h); b.appendChild(s);
        b.addEventListener('click', function () { pick(u.id); });
        picks.appendChild(b);
      })(ch[n]);
    }
    mode = 'level'; show('level');
    var first = picks.querySelector('button'); if (first) { first.focus(); }
  }
  function pick(id) {
    if (id === 'grep' || id === 'tail' || id === 'kill') { S.w[id]++; }
    else if (id === 'nice') { S.spd *= 1.12; }
    else if (id === 'ram') { S.mhp += 25; S.hp = Math.min(S.mhp, S.hp + 25); }
    else if (id === 'cache') { S.mag *= 1.4; }
    else if (id === 'cpu') { S.dm *= 1.15; }
    if (S.xp >= S.need) { levelUp(); return; }
    mode = 'play'; show(''); last = performance.now(); cv.focus();
  }

  function hit(e, dmg) {
    e.hp -= dmg * S.dm; e.fl = 0.08;
    if (e.hp > 0) { return; }
    e.dead = true; S.kills++;
    S.gem.push({ x: e.x, y: e.y, v: e.d.xp });
  }

  function update(dt) {
    S.t += dt;
    if (S.t >= DURATION) { end(true); return; }
    // movement
    var dx = 0, dy = 0;
    if (keys.ArrowLeft || keys.a) { dx -= 1; }
    if (keys.ArrowRight || keys.d) { dx += 1; }
    if (keys.ArrowUp || keys.w) { dy -= 1; }
    if (keys.ArrowDown || keys.s) { dy += 1; }
    if (joy) { dx += joy.x; dy += joy.y; }
    var m = Math.sqrt(dx * dx + dy * dy);
    if (m > 1) { dx /= m; dy /= m; }
    if (m > 0.05) { S.face = Math.atan2(dy, dx); }
    S.px += dx * S.spd * dt; S.py += dy * S.spd * dt;
    if (S.inv > 0) { S.inv -= dt; }
    // spawning
    var iv = Math.max(0.12, 0.85 - S.t * 0.0025);
    S.sp -= dt;
    while (0 >= S.sp) { if (S.en.length > 260) { S.sp = iv; break; } spawn(); S.sp += iv; if (S.t > 150) { spawn(); } }
    var i, j, e, p, g;
    // enemies
    for (i = 0; S.en.length > i; i++) {
      e = S.en[i];
      var ex = S.px - e.x, ey = S.py - e.y, ed = Math.sqrt(ex * ex + ey * ey) || 1;
      e.x += ex / ed * e.d.sp * dt; e.y += ey / ed * e.d.sp * dt;
      if (e.fl > 0) { e.fl -= dt; }
      if (e.ht > 0) { e.ht -= dt; }
      if (e.d.r + 10 > ed) {
        if (0 >= S.inv) { S.hp -= e.d.dmg; S.inv = 0.45; if (0 >= S.hp) { S.hp = 0; end(false); return; } }
      }
    }
    // grep
    S.cdg -= dt;
    if (0 >= S.cdg) {
      var gl = S.w.grep, tgt = null, bd = 1e9;
      for (i = 0; S.en.length > i; i++) {
        e = S.en[i]; var q = (e.x - S.px) * (e.x - S.px) + (e.y - S.py) * (e.y - S.py);
        if (bd > q) { bd = q; tgt = e; }
      }
      if (tgt) {
        var cnt = 1 + (gl > 2 ? 1 : 0) + (gl > 4 ? 1 : 0);
        var base = Math.atan2(tgt.y - S.py, tgt.x - S.px);
        for (j = 0; cnt > j; j++) {
          var an = base + (j - (cnt - 1) / 2) * 0.18;
          S.pr.push({ x: S.px, y: S.py, vx: Math.cos(an) * 380, vy: Math.sin(an) * 380, life: 1.2, pi: 1 + Math.floor(gl / 3), dmg: 7 + 3 * gl });
        }
        S.cdg = Math.max(0.3, 0.95 - 0.11 * gl);
      } else { S.cdg = 0.2; }
    }
    for (i = 0; S.pr.length > i; i++) {
      p = S.pr[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      for (j = 0; S.en.length > j; j++) {
        e = S.en[j];
        if (e.dead) { continue; }
        var ddx = e.x - p.x, ddy = e.y - p.y, rr = e.d.r + 4;
        if (rr * rr > ddx * ddx + ddy * ddy) { hit(e, p.dmg); p.pi--; if (0 >= p.pi) { p.life = 0; break; } }
      }
    }
    // tail -f orbs
    var tl = S.w.tail;
    if (tl > 0) {
      S.ang += dt * 2.4;
      var orbs = tl + 1;
      for (j = 0; orbs > j; j++) {
        var oa = S.ang + j * 6.2832 / orbs, ox = S.px + Math.cos(oa) * (62 + tl * 6), oy = S.py + Math.sin(oa) * (62 + tl * 6);
        for (i = 0; S.en.length > i; i++) {
          e = S.en[i];
          if (e.dead || e.ht > 0) { continue; }
          var qx = e.x - ox, qy = e.y - oy, qr = e.d.r + 7;
          if (qr * qr > qx * qx + qy * qy) { hit(e, 6 + 2 * tl); e.ht = 0.4; }
        }
      }
    }
    // kill -9 pulse
    var kl = S.w.kill;
    if (kl > 0) {
      S.cdk -= dt;
      if (0 >= S.cdk) {
        var rad = 95 + 16 * kl;
        for (i = 0; S.en.length > i; i++) {
          e = S.en[i]; var kx = e.x - S.px, ky = e.y - S.py;
          if (rad * rad > kx * kx + ky * ky) { if (!e.dead) { hit(e, 18 + 9 * kl); } }
        }
        S.fx.push({ x: S.px, y: S.py, r: 0, max: rad, life: 0.35, t: 0.35 });
        S.cdk = Math.max(1.6, 4.6 - 0.5 * kl);
      }
    }
    // gems
    for (i = 0; S.gem.length > i; i++) {
      g = S.gem[i];
      var gx = S.px - g.x, gy = S.py - g.y, gd = Math.sqrt(gx * gx + gy * gy) || 1;
      if (S.mag > gd) { g.x += gx / gd * 320 * dt; g.y += gy / gd * 320 * dt; }
      if (14 > gd) { g.take = true; S.xp += g.v; }
    }
    // cleanup
    var ne = [];
    for (i = 0; S.en.length > i; i++) {
      e = S.en[i];
      var cx = e.x - S.px, cy = e.y - S.py;
      if (!e.dead) { if (1400 * 1400 > cx * cx + cy * cy) { ne.push(e); } }
    }
    S.en = ne;
    var np = [];
    for (i = 0; S.pr.length > i; i++) { if (S.pr[i].life > 0) { np.push(S.pr[i]); } }
    S.pr = np;
    var ng = [];
    for (i = 0; S.gem.length > i; i++) { if (!S.gem[i].take) { ng.push(S.gem[i]); } }
    S.gem = ng;
    var nf = [];
    for (i = 0; S.fx.length > i; i++) { S.fx[i].life -= dt; if (S.fx[i].life > 0) { nf.push(S.fx[i]); } }
    S.fx = nf;
    if (S.xp >= S.need) { levelUp(); }
  }

  function draw() {
    var cx = S.px - W / 2, cy = S.py - H / 2, i, e;
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
    var gx0 = -((cx % 60) + 60) % 60, gy0 = -((cy % 60) + 60) % 60;
    for (var x = gx0; W > x; x += 60) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (var y = gy0; H > y; y += 60) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
    // gems
    ctx.fillStyle = C.green;
    for (i = 0; S.gem.length > i; i++) { var g = S.gem[i]; ctx.fillRect(g.x - cx - 3, g.y - cy - 3, 6, 6); }
    // fx
    for (i = 0; S.fx.length > i; i++) {
      var f = S.fx[i], k = 1 - f.life / f.t;
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = C.amber; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x - cx, f.y - cy, f.max * k, 0, 6.2832); ctx.stroke(); ctx.globalAlpha = 1;
    }
    // enemies
    ctx.font = '600 11px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (i = 0; S.en.length > i; i++) {
      e = S.en[i];
      var sx = e.x - cx, sy = e.y - cy;
      if (-40 > sx || sx > W + 40 || -40 > sy || sy > H + 40) { continue; }
      ctx.fillStyle = e.fl > 0 ? C.text : C.red;
      ctx.fillRect(sx - e.d.r, sy - e.d.r, e.d.r * 2, e.d.r * 2);
      if (e.d.r > 10) { ctx.fillStyle = C.bg; ctx.fillText(e.d.ch, sx, sy + 1); }
    }
    // projectiles
    ctx.fillStyle = C.amber;
    for (i = 0; S.pr.length > i; i++) { var p = S.pr[i]; ctx.beginPath(); ctx.arc(p.x - cx, p.y - cy, 4, 0, 6.2832); ctx.fill(); }
    // orbs
    if (S.w.tail > 0) {
      var orbs = S.w.tail + 1;
      ctx.fillStyle = C.green;
      for (var j = 0; orbs > j; j++) {
        var oa = S.ang + j * 6.2832 / orbs, rr = 62 + S.w.tail * 6;
        ctx.beginPath(); ctx.arc(S.px - cx + Math.cos(oa) * rr, S.py - cy + Math.sin(oa) * rr, 7, 0, 6.2832); ctx.fill();
      }
    }
    // player
    var pxs = W / 2, pys = H / 2;
    var blink = 1;
    if (S.inv > 0) { if (Math.floor(S.t * 20) % 2 === 0) { blink = 0.45; } }
    ctx.globalAlpha = blink;
    ctx.fillStyle = C.amber; ctx.beginPath(); ctx.arc(pxs, pys, 10, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = C.text; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(pxs, pys); ctx.lineTo(pxs + Math.cos(S.face) * 16, pys + Math.sin(S.face) * 16); ctx.stroke();
    ctx.globalAlpha = 1;
    // joystick
    if (joy) {
      ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 40, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = C.amber; ctx.beginPath(); ctx.arc(joy.ox + joy.x * 40, joy.oy + joy.y * 40, 12, 0, 6.2832); ctx.fill();
    }
    // HUD
    ctx.fillStyle = C.surface; ctx.fillRect(0, 0, W, 34);
    ctx.fillStyle = C.line; ctx.fillRect(12, 11, 160, 12);
    ctx.fillStyle = C.red; ctx.fillRect(12, 11, 160 * (S.hp / S.mhp), 12);
    ctx.fillStyle = C.text; ctx.textAlign = 'left'; ctx.font = '12px monospace';
    ctx.fillText('HP ' + Math.ceil(S.hp) + '/' + S.mhp, 182, 18);
    ctx.textAlign = 'right';
    ctx.fillText('uptime ' + fmt(S.t) + ' / 05:00   lv ' + S.lvl + '   kills ' + S.kills, W - 12, 18);
    ctx.fillStyle = C.line; ctx.fillRect(0, H - 6, W, 6);
    ctx.fillStyle = C.amber; ctx.fillRect(0, H - 6, W * Math.min(1, S.xp / S.need), 6);
  }

  function frame(now) {
    if (S) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (mode === 'play') {
        if (!document.hidden) { update(dt); } else { pauseGame(); }
      }
      if (S) { draw(); }
    }
    requestAnimationFrame(frame);
  }
  function pauseGame() { if (mode === 'play') { mode = 'pause'; show('pause'); } }
  function resumeGame() { if (mode === 'pause') { mode = 'play'; show(''); last = performance.now(); cv.focus(); } }

  root.addEventListener('click', function (ev) {
    var a = ev.target.getAttribute ? ev.target.getAttribute('data-act') : null;
    if (a === 'start') { start(); }
    else if (a === 'resume') { resumeGame(); }
  });
  window.addEventListener('keydown', function (ev) {
    var k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (k === 'p' || k === 'Escape') { if (mode === 'play') { pauseGame(); } else if (mode === 'pause') { resumeGame(); } return; }
    if (document.activeElement === cv) {
      if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' ') { ev.preventDefault(); }
    }
    keys[k] = true;
  });
  window.addEventListener('keyup', function (ev) {
    var k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    keys[k] = false;
  });
  window.addEventListener('blur', function () { keys = {}; pauseGame(); });
  function pos(ev) {
    var r = cv.getBoundingClientRect();
    return { x: (ev.clientX - r.left) * (W / r.width), y: (ev.clientY - r.top) * (H / r.height) };

    if (ev.pointerType === 'mouse') { return; }
    var p = pos(ev); joy = { id: ev.pointerId, ox: p.x, oy: p.y, x: 0, y: 0 };

    joy.x = dx / d * c; joy.y = dy / d * c;

  cv.addEventListener('pointerup', endJoy);
  cv.addEventListener('pointercancel', endJoy);

  reset(); S.hp = S.mhp; draw();
  requestAnimationFrame(frame);
  var themeObs = new MutationObserver(readColors);
  themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
